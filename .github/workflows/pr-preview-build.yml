name: PR preview build

# Builds the PR with a read-only token and no secrets (fork PRs included) and
# uploads the site as an artifact. pr-preview-deploy.yml publishes it to
# Cloudflare Pages from a trusted context. Doubles as the PR build check.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build
        run: |
          uv sync --frozen
          uv run zensical build --clean --strict

      # PDFs and audio are ~510 MB of the ~537 MB site and over Cloudflare
      # Pages' 25 MiB per-file limit in places; previews link to them but
      # don't carry them.
      - name: Trim for preview
        run: |
          find site -type f \( -name '*.pdf' -o -name '*.mp3' -o -name '*.opus' \) -delete
          rm -f site/CNAME
          du -sh site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-site
          path: site
          retention-days: 7
          if-no-files-found: error

name: PR preview deploy

# Publishes the artifact from "PR preview build" to Cloudflare Pages and
# comments the preview URL on the PR. Runs from master with the Cloudflare
# secret, so it never checks out or executes PR code: the artifact is
# treated as untrusted static files.
#
# Setup (repo admin): secret CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages >
# Edit), variables CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_PAGES_PROJECT.
# Without the variables this workflow skips, so forks and unconfigured
# clones stay green.

# Safe use of workflow_run: no checkout, artifact is data only (see Sanitize).
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [PR preview build]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

concurrency:
  group: pr-preview-deploy-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      vars.CLOUDFLARE_ACCOUNT_ID != '' &&
      vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    steps:
      # Fork PRs leave workflow_run.pull_requests empty, so match the open PR
      # by head SHA and head repo rather than trusting anything in the artifact.
      - name: Find PR
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const headRepo = run.head_repository?.full_name;
            if (!headRepo) { core.notice('Head repository is gone; nothing to preview.'); return; }
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const pr = prs.find(p => p.head.sha === run.head_sha
              && p.head.repo && p.head.repo.full_name === headRepo);
            if (!pr) { core.notice(`No open PR for ${run.head_sha}; nothing to preview.`); return; }
            core.setOutput('number', String(pr.number));

      - name: Download site
        if: steps.pr.outputs.number
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-site
          path: preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Pages would run _worker.js / functions/ as server code on our account,
      # and _headers/_redirects could change how the preview is served.
      - name: Sanitize
        if: steps.pr.outputs.number
        run: |
          rm -rf preview/_worker.js preview/functions preview/_routes.json preview/_redirects preview/wrangler.*
          printf '/*\n  X-Robots-Tag: noindex\n' > preview/_headers
          printf 'User-agent: *\nDisallow: /\n' > preview/robots.txt

      - name: Deploy to Cloudflare Pages
        if: steps.pr.outputs.number
        id: cf
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.156.1
          command: >-
            pages deploy preview
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=pr-${{ steps.pr.outputs.number }}
            --commit-hash=${{ github.event.workflow_run.head_sha }}
            --commit-dirty=true

      - name: Comment preview URL
        if: steps.pr.outputs.number
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          ALIAS_URL: ${{ steps.cf.outputs.pages-deployment-alias-url }}
          DEPLOY_URL: ${{ steps.cf.outputs.deployment-url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const marker = '<!-- pr-preview -->';
            const url = process.env.ALIAS_URL || process.env.DEPLOY_URL;
            if (!url) { core.setFailed('Wrangler returned no deployment URL.'); return; }
            const body = `${marker}\n**Preview:** ${url}\n\n` +
              `Built from ${process.env.HEAD_SHA.slice(0, 8)}. PDFs and audio are left out of previews, ` +
              `so links to them 404 here.`;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number, per_page: 100,
            });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number, body,
              });
            }
